      type: object
      required: [id, documentId, projectId, text, document, score]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        text: { type: string }
        document: { type: string, description: Imported document title }
        sourceUrl: { type: string, format: uri }
        sourceKind: { type: string }
        score: { type: number, description: Cosine similarity score; native pgvector is used when available }
    KnowledgeSearchResponse:
      type: object
      required: [results]
      properties:
        results: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/KnowledgeSearchResult' } }
    KnowledgeIngestResponse:
      type: object
      required: [document, chunks, entities, edges]
      properties:
        document: { $ref: '#/components/schemas/KnowledgeDocument' }
        chunks: { type: integer, minimum: 0 }
        entities: { type: integer, minimum: 0 }
        edges: { type: integer, minimum: 0 }
    Readiness:
      type: object
      required: [status, storage, objectStore, graphStore, vectorStore, browserAgent, mcpSource]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        storage: { type: string, enum: [ok, error] }
        objectStore: { type: string, enum: [configured, inline] }
        graphStore: { type: string, enum: [configured, inline] }
        vectorStore: { type: string, enum: [pgvector, jsonb-fallback, inline] }
        browserAgent: { type: string, enum: [configured, disabled] }
        mcpSource: { type: string, enum: [configured, disabled] }
    EvidenceSource:
      type: object
      required: [name, kind, url, authority, mapped, relevanceScore]
      properties:
        name: { type: string }
        kind: { type: string, description: Normalized connector category such as Papers, Video, Official Docs, or Community }
        url: { type: string, format: uri, pattern: '^https?://' }
        authority: { type: number, minimum: 0, maximum: 100 }
        publishedAt: { type: string, description: Source publication/update date when available }
        snippet: { type: string }
        mapped: { type: boolean, description: Whether the concrete result may be used as claim evidence }
        provider: { type: string, description: Optional adapter provenance such as MCP }
        relevanceScore: { type: number, minimum: 0, maximum: 1 }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of retrieved source bytes when verification succeeded }
        verification: { type: string, enum: [source-mapped, verified, unreachable] }
        verifiedAt: { type: string, format: date-time }
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
    SourceSnapshot:
      type: object
      required: [id, projectId, tenantId, topic, fetchedAt, sourceCount, sources, trigger, changeStatus, changes]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        topic: { type: string }
        fetchedAt: { type: string, format: date-time }
        sourceCount: { type: integer, minimum: 0 }
        trigger: { type: string, enum: [manual, scheduled] }
        changeStatus: { type: string, enum: [changed, unchanged] }
        changes:
          type: object
          required: [changed, added, updated, removed]
          properties:
            changed: { type: boolean }
            added: { type: integer, minimum: 0 }
            updated: { type: integer, minimum: 0 }
            removed: { type: integer, minimum: 0 }
        autoUpdateStatus: { type: string, enum: [running, completed, unchanged, disabled, busy, quota-exceeded, failed] }
        autoUpdateJobId: { type: string, format: uuid }
        artifactId: { type: string, format: uuid }
        autoUpdatedAt: { type: string, format: date-time }
        autoUpdateError: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/EvidenceSource' }
    WatchConfig:
      type: object
      required: [projectId, tenantId, enabled, frequency, autoUpdate]
      properties:
        projectId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        enabled: { type: boolean }
        frequency: { type: string, enum: [manual, daily, weekly] }
        autoUpdate: { type: boolean }
        updatedAt: { type: string, format: date-time }
        lastRefreshedAt: { type: string, format: date-time }
        refreshing: { type: boolean }
        refreshStartedAt: { type: string, format: date-time }
        lastError: { type: string }
    ContinuousUpdateResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [completed, unchanged, disabled, busy, quota-exceeded, failed, deleted] }
        artifactId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        error: { type: string }
