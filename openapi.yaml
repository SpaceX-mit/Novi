openapi: 3.1.0
info:
  title: Novi Knowledge Scientist API
  version: 0.1.0
  description: Workspace, evidence, usage and asynchronous generation API.
servers:
  - url: http://127.0.0.1:4173
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      responses:
        '200': { description: Service is alive }
  /api/ready:
    get:
      security: []
      responses:
        '200':
          description: Storage and external projection backends are ready/configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503': { description: Storage is unavailable }
  /api/metrics:
    get:
      responses:
        '200':
          description: Authenticated operational metrics, including pending external projections
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics:
                    type: object
                    properties:
                      externalProjectionPending: { type: integer, minimum: 0 }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
  /api/auth/register:
    post:
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '201': { description: Account created }
        '409': { description: Email already exists }
  /api/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '200': { description: Session created }
        '401': { description: Invalid credentials }
  /api/auth/logout:
    post:
      responses: { '204': { description: Session revoked } }
  /api/auth/me:
    get:
      responses: { '200': { description: Current authenticated user }, '401': { description: Authentication required } }
  /api/auth/oidc/start:
    get:
      security: []
      responses:
        '302': { description: Redirect to OIDC provider }
        '503': { description: OIDC is not configured }
  /api/auth/oidc/callback:
    get:
      security: []
      responses:
        '302': { description: Set local session and redirect to app }
        '400': { description: Invalid or expired state }
  /api/projects:
    get:
      responses: { '200': { description: Tenant projects } }
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } }
      responses:
        '201': { description: Workspace created }
        '422': { description: Validation failed }
  /api/projects/{id}/generate:
    post:
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - in: query
          name: async
          schema: { type: boolean }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentGenerationInput' }
      responses:
        '200': { description: Synchronous artifact result }
        '202': { description: Queued generation job }
        '402': { description: Usage quota exceeded }
  /api/projects/{id}:
    get:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses: { '200': { description: Project detail }, '404': { description: Project not found } }
    delete:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses: { '204': { description: 'Project, jobs, knowledge and update data deleted; unfinished generation usage refunded once' }, '403': { description: Admin role required } }
  /api/projects/{id}/sessions:
    get:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses: { '200': { description: Tenant-scoped Agent session summaries } }
    post:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { title: { type: string, maxLength: 120 } }
      responses: { '201': { description: Agent session created }, '403': { description: Editor role required } }
  /api/projects/{id}/sessions/{sessionId}/messages:
    post:
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/SessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentConversationInput' }
      responses:
        '202': { description: Queued LangGraph conversation response job }
        '402': { description: Usage quota exceeded }
        '403': { description: Editor role required }
        '404': { description: Project or session not found }
        '409': { description: Active LLM provider required or session/workspace already running }
  /api/projects/{id}/sessions/{sessionId}:
    get:
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/SessionId' } ]
      responses: { '200': { description: Agent session messages and active run }, '404': { description: Session not found } }
    delete:
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/SessionId' } ]
      responses: { '204': { description: Idle Agent session deleted }, '409': { description: Session has an active run } }
  /api/projects/{id}/pin:
    patch:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses: { '200': { description: Pin state toggled } }
  /api/projects/{id}/export:
    get:
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - in: query
          name: format
          schema: { type: string, enum: [markdown, latex], default: markdown }
        - in: query
          name: artifactId
          description: Optional immutable artifact version ID; defaults to the latest version.
          schema: { type: string, format: uuid }
        - in: query
          name: template
          description: LaTeX document class preset; used only when format is latex.
          schema: { type: string, enum: [article, ieee, acm], default: article }
      responses: { '200': { description: Exported artifact }, '404': { description: Artifact not found } }
  /api/projects/{id}/knowledge:
    get:
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - in: query
          name: q
          schema: { type: string, maxLength: 500 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Project knowledge inventory, or semantic passage results when q is supplied
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/KnowledgeResponse' }
                  - { $ref: '#/components/schemas/KnowledgeSearchResponse' }
        '404': { description: Project not found }
        '422': { description: Search query is longer than 500 characters }
    post:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeDocumentInput' } } }
      responses:
        '201':
          description: Document ingested and indexed; external projection status is included on document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeIngestResponse' }
        '422': { description: Invalid document }
  /api/projects/{id}/knowledge/import:
    post:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, url]
              properties:
                title: { type: string, maxLength: 200 }
                url: { type: string, format: uri, pattern: '^https?://' }
                render: { type: string, enum: [static, browser], default: static, description: Use the configured isolated Browser Agent for JavaScript-rendered pages }
      responses:
        '201': { description: 'Remote web/PDF/text, JavaScript-rendered page, or public GitHub repository fetched and indexed' }
        '409': { description: Document content already indexed }
        '422': { description: 'Invalid, private, oversized, or non-extractable remote document' }
        '503': { description: Browser rendering was requested but Browser Agent is not configured }
  /api/projects/{id}/knowledge/{documentId}:
    delete:
      description: Removes the document, chunks, vectors and graph entities from active semantic memory and enqueues durable external object/graph deletion. Existing immutable artifact versions retain excerpts already used; delete the workspace or account for a full purge.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Knowledge document removed and external deletion enqueued }
        '403': { description: Editor role required }
        '404': { description: Project or knowledge document not found }
  /api/projects/{id}/watch:
    get:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200':
          description: Watch configuration
          content: { application/json: { schema: { type: object, required: [watch], properties: { watch: { $ref: '#/components/schemas/WatchConfig' } } } } }
    put:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, frequency: { type: string, enum: [manual, daily, weekly], default: manual }, autoUpdate: { type: boolean, default: true, description: Generate a new immutable artifact when source changes are detected } } } } }
      responses:
        '200':
          description: Watch configuration updated
          content: { application/json: { schema: { type: object, required: [watch], properties: { watch: { $ref: '#/components/schemas/WatchConfig' } } } } }
        '403': { description: Editor role required }
        '422': { description: Invalid watch configuration }
  /api/projects/{id}/refresh:
    post:
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200':
          description: Source snapshot refreshed and, when sources changed and auto-update is enabled, a new immutable artifact generated
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, update]
                properties:
                  snapshot: { $ref: '#/components/schemas/SourceSnapshot' }
                  update: { $ref: '#/components/schemas/ContinuousUpdateResult' }
        '402': { description: Source quota exceeded }
        '403': { description: Editor role required }
        '409': { description: Refresh already running or lease superseded }
        '502': { description: Providers unavailable }
  /api/projects/{id}/snapshots:
    get:
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Tenant-scoped source snapshot history
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: '#/components/schemas/SourceSnapshot' }
        '404': { description: Project not found }
  /api/jobs/{id}:
    get:
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses: { '200': { description: Job status } }
  /api/agent/modes:
    get:
      responses:
        '200':
          description: Available adaptive Agent execution modes
          content:
            application/json:
              schema:
                type: object
                required: [modes, defaultMode]
                properties:
                  defaultMode: { type: string, const: auto }
                  modes:
                    type: array
                    items: { $ref: '#/components/schemas/AgentMode' }
  /api/agent/tools:
    get:
      description: Lists tenant Agent tools without returning stored bearer tokens. All members may inspect the tools available to runs.
      responses:
        '200':
          description: Sanitized built-in and custom tool settings
          content: { application/json: { schema: { type: object, required: [settings, configurable], properties: { settings: { $ref: '#/components/schemas/AgentToolSettings' }, configurable: { type: boolean } } } } }
    put:
      description: Replaces tenant tool settings. Custom endpoints require an allowlisted HTTPS hostname; blank bearer tokens preserve an existing encrypted token.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentToolSettingsInput' } } }
      responses:
        '200': { description: Agent tools saved, content: { application/json: { schema: { type: object, required: [settings], properties: { settings: { $ref: '#/components/schemas/AgentToolSettings' } } } } } }
        '403': { description: Admin role required }
        '422': { description: 'Invalid tool name, schema, duplicate, or endpoint' }
        '503': { description: Production credential encryption is not configured }
  /api/agent/mcp:
    get:
      description: Lists tenant Streamable HTTP MCP servers and discovered tools without returning bearer credentials.
      responses:
        '200':
          description: Sanitized MCP settings
          content: { application/json: { schema: { type: object, required: [settings, configurable], properties: { settings: { $ref: '#/components/schemas/McpSettings' }, configurable: { type: boolean } } } } }
    put:
      description: Replaces tenant MCP server settings. Discovered schemas remain server-controlled; clients submit only enabled tool names.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/McpSettingsInput' } } }
      responses:
        '200': { description: MCP settings saved, content: { application/json: { schema: { type: object, required: [settings], properties: { settings: { $ref: '#/components/schemas/McpSettings' } } } } } }
        '403': { description: Admin role required }
        '422': { description: 'Invalid, duplicated, insecure, or non-allowlisted MCP server' }
        '503': { description: Production credential encryption is not configured }
  /api/agent/mcp/servers/{serverId}/sync:
    post:
      description: Uses the official MCP client to initialize a saved Streamable HTTP server and refresh its advertised tools. Newly discovered tools remain disabled.
      parameters: [ { $ref: '#/components/parameters/McpServerId' } ]
      responses:
        '200': { description: MCP server connected and tool catalog refreshed }
        '403': { description: Admin role required }
        '404': { description: MCP server not found }
        '409': { description: Configuration changed while discovery was running }
        '502': { description: MCP protocol discovery failed }
  /api/agent/skills:
    get:
      description: Lists tenant organization Skills. Instructions are visible to organization members because they can affect generated artifacts.
      responses:
        '200':
          description: Tenant Skill settings
          content: { application/json: { schema: { type: object, required: [settings, configurable], properties: { settings: { $ref: '#/components/schemas/AgentSkillSettings' }, configurable: { type: boolean } } } } }
    put:
      description: Replaces tenant Skills. Skills are bounded prompt guidance and cannot grant tools, sources, or policy exceptions.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentSkillSettingsInput' } } }
      responses:
        '200': { description: Agent Skills saved, content: { application/json: { schema: { type: object, required: [settings], properties: { settings: { $ref: '#/components/schemas/AgentSkillSettings' } } } } } }
        '403': { description: Admin role required }
        '422': { description: 'Invalid, duplicated, oversized, or unsupported Skill configuration' }
  /api/agent/plugins:
    get:
      description: Lists declarative tenant Plugins and currently referenceable Skills/tools.
      responses:
        '200': { description: Tenant Plugin settings, content: { application/json: { schema: { type: object, required: [settings, configurable], properties: { settings: { $ref: '#/components/schemas/AgentPluginSettings' }, configurable: { type: boolean } } } } } }
    put:
      description: Replaces declarative Plugins. Plugins may reference only existing Skills and already-authorized tools and cannot load executable code.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPluginSettingsInput' } } }
      responses:
        '200': { description: Agent Plugins saved }
        '403': { description: Admin role required }
        '422': { description: Invalid manifest or unavailable capability reference }
  /api/search:
    get:
      parameters:
        - in: query
          name: topic
          required: true
          schema: { type: string, minLength: 1, maxLength: 300 }
      responses: { '200': { description: Normalized source results from built-in API catalogs and the optional MCP source tool }, '402': { description: Source quota exceeded }, '502': { description: Providers unavailable } }
  /api/usage:
    get:
      responses: { '200': { description: Current plan and monthly usage } }
  /api/billing:
    get:
      responses: { '200': { description: Current billing snapshot } }
  /api/billing/checkout:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [plan], properties: { plan: { type: string, enum: [personal, pro, enterprise] }, returnUrl: { type: string, format: uri } } } } }
      responses:
        '200': { description: Checkout URL }
        '403': { description: Admin role required }
        '503': { description: Payment provider is not configured }
  /api/billing/webhook:
    post:
      security: []
      parameters:
        - in: header
          name: X-Novi-Signature
          required: true
          schema: { type: string }
      responses:
        '200': { description: Event accepted }
        '401': { description: Invalid signature }
  /api/me/export:
    get:
      responses: { '200': { description: Portable tenant data JSON } }
  /api/me:
    delete:
      responses: { '204': { description: Account deleted } }
  /api/org:
    get:
      responses: { '200': { description: Current organization and role } }
  /api/llm/providers:
    get:
      description: Lists supported providers and tenant configurations without returning API keys or encrypted credentials.
      responses:
        '200':
          description: Provider catalog and sanitized tenant configurations
          content: { application/json: { schema: { $ref: '#/components/schemas/LlmProviderSettings' } } }
        '403': { description: Admin role required }
  /api/llm/provider:
    put:
      description: Saves and activates a tenant LLM provider. A blank API key preserves an existing encrypted credential for that provider.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LlmProviderInput' } } }
      responses:
        '200':
          description: Provider encrypted and activated
          content: { application/json: { schema: { type: object, required: [config], properties: { config: { $ref: '#/components/schemas/LlmProviderConfig' } } } } }
        '403': { description: Admin role required }
        '422': { description: 'Provider, model, endpoint, or credential is invalid' }
        '503': { description: Production credential encryption is not configured }
    delete:
      description: Disables the active tenant provider and returns generation to deterministic offline mode without deleting stored encrypted credentials.
      responses:
        '204': { description: Provider disabled }
        '403': { description: Admin role required }
  /api/llm/provider/test:
    post:
      description: Performs a minimal request against the active provider. The operation can consume provider tokens.
      responses:
        '200':
          description: Provider connection succeeded
          content: { application/json: { schema: { $ref: '#/components/schemas/LlmProviderTestResult' } } }
        '403': { description: Admin role required }
        '409': { description: No active provider is configured }
        '502': { description: Provider request failed }
  /api/orgs:
    get:
      responses:
        '200':
          description: Organizations available to the current user, including role and current selection
  /api/org/members:
    get:
      responses: { '200': { description: Organization members } }
  /api/org/members/{id}:
    patch:
      parameters: [ { $ref: '#/components/parameters/MemberId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [viewer, editor, admin] } } } } }
      responses: { '200': { description: Member role updated }, '403': { description: Insufficient permissions } }
    delete:
      parameters: [ { $ref: '#/components/parameters/MemberId' } ]
      responses: { '200': { description: Member removed }, '403': { description: Insufficient permissions } }
  /api/org/invitations:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { type: string, enum: [viewer, editor, admin] } } } } }
      responses: { '201': { description: Invitation created } }
  /api/org/invitations/{id}/accept:
    post:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses: { '200': { description: Invitation accepted }, '400': { description: Invalid invitation } }
  /api/auth/switch:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [tenantId], properties: { tenantId: { type: string, format: uuid } } } } }
      responses: { '200': { description: Session switched to organization } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ProjectId: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    JobId: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    SessionId: { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
    MemberId: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    McpServerId: { in: path, name: serverId, required: true, schema: { type: string, format: uuid } }
  schemas:
    AgentGenerationInput:
      type: object
      properties:
        prompt: { type: string, minLength: 1, maxLength: 20000 }
        mode: { type: string, enum: [auto, workflow, react, plan-execute, supervisor], default: auto }
        sessionId: { type: string, format: uuid, description: Existing project Agent session; defaults to the most recently updated session }
    AgentConversationInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 20000 }
        mode: { type: string, enum: [auto, workflow, react, plan-execute, supervisor], default: auto }
    AgentMessage:
      type: object
      required: [id, role, kind, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        kind: { type: string, enum: [welcome, message, artifact, error] }
        content: { type: string, maxLength: 20000 }
        runId: { type: string }
        jobId: { type: string }
        artifactId: { type: string, format: uuid }
        mode: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        toolCalls: { type: array, maxItems: 20, items: { type: object }, description: Bounded tool invocation provenance retained with the completed assistant message }
        skills: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/AppliedAgentSkill' }, description: Skills applied to the completed artifact run }
        plugins: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/AppliedAgentPlugin' }, description: Declarative Plugins applied to the completed artifact run }
        runtime: { type: object, description: LangGraph conversation runtime provenance without credentials }
        createdAt: { type: string, format: date-time }
    AgentSession:
      type: object
      required: [id, tenantId, projectId, title, status, messages, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        projectId: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        status: { type: string, enum: [idle, running] }
        activeRun: { type: [object, 'null'] }
        messages: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/AgentMessage' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentMode:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, enum: [workflow, react, plan-execute, supervisor] }
        name: { type: string }
        description: { type: string }
    AgentToolInputSchema:
      type: object
      required: [type, additionalProperties, properties, required]
      properties:
        type: { type: string, const: object }
        additionalProperties: { type: boolean, const: false }
        properties:
          type: object
          maxProperties: 12
          additionalProperties:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [string, number, boolean] }
              description: { type: string, maxLength: 200 }
              maxLength: { type: integer, minimum: 1, maximum: 20000 }
        required: { type: array, items: { type: string } }
    CustomAgentToolInput:
      type: object
      required: [name, description, endpoint, inputSchema]
      properties:
        id: { type: string }
        name: { type: string, pattern: '^[a-z][a-z0-9_]{1,47}$' }
        description: { type: string, minLength: 1, maxLength: 500 }
        endpoint: { type: string, format: uri, maxLength: 500 }
        enabled: { type: boolean, default: true }
        bearerToken: { type: string, maxLength: 2000, writeOnly: true }
        inputSchema: { $ref: '#/components/schemas/AgentToolInputSchema' }
    AgentToolSettingsInput:
      type: object
      properties:
        builtins:
          type: object
          properties:
            workspace_read: { type: boolean }
            workspace_write: { type: boolean }
            web_search: { type: boolean }
        customTools: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/CustomAgentToolInput' } }
    AgentToolSettings:
      type: object
      required: [builtins, customTools]
      properties:
        builtins: { type: array, items: { type: object } }
        customTools: { type: array, maxItems: 10, items: { type: object } }
        updatedAt: { type: [string, 'null'], format: date-time }
    McpServerInput:
      type: object
      required: [name, endpoint]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
